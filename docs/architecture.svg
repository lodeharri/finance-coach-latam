<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title id="title">Finance Coach LATAM — Architecture</title>
  <desc id="desc">A serverless request flow on AWS: the React SPA on Cloudflare Pages reaches an API Gateway protected by Cognito JWTs, an API Lambda writes to Neon Postgres and publishes to SQS, a Categorizer Lambda picks up the message, calls Gemini for embeddings and ambiguity resolution, and writes the category back to Postgres.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
    </marker>
    <marker id="arrow-auth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/>
    </marker>
  </defs>

  <rect width="1100" height="600" fill="#FAFAF7"/>

  <!-- Header -->
  <g>
    <text x="50" y="50" font-size="22" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Finance Coach LATAM</text>
    <text x="50" y="76" font-size="13" font-weight="500" fill="#475569">Serverless async pipeline · AWS · Cloudflare · Neon Postgres · Gemini</text>
  </g>

  <!-- Zone labels -->
  <g font-size="10" font-weight="700" letter-spacing="1.4" fill="#64748B">
    <text x="50" y="120">CLIENT · EDGE</text>
    <text x="330" y="120">AWS · us-east-1</text>
    <text x="940" y="120">EXTERNAL</text>
  </g>
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 4">
    <line x1="290" y1="108" x2="290" y2="540"/>
    <line x1="900" y1="108" x2="900" y2="540"/>
  </g>

  <!-- ========== ROW A — request flow (y=150) ========== -->
  <!-- User -->
  <g transform="translate(60,150)">
    <rect width="110" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="4" height="86" rx="2" fill="#334155"/>
    <text x="63" y="32" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
    <text x="63" y="54" font-size="11" fill="#64748B" text-anchor="middle">Browser</text>
    <text x="63" y="70" font-size="11" fill="#64748B" text-anchor="middle">EN / ES · LATAM</text>
  </g>

  <!-- Cloudflare Pages -->
  <g transform="translate(200,150)">
    <rect width="150" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="4" height="86" rx="2" fill="#F48120"/>
    <text x="83" y="32" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Cloudflare Pages</text>
    <text x="83" y="52" font-size="11" fill="#64748B" text-anchor="middle">React 18 SPA</text>
    <text x="83" y="68" font-size="11" fill="#64748B" text-anchor="middle">Global edge · CDN</text>
  </g>

  <!-- API Gateway -->
  <g transform="translate(380,150)">
    <rect width="150" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="4" height="86" rx="2" fill="#4F46E5"/>
    <text x="83" y="32" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">API Gateway</text>
    <text x="83" y="52" font-size="11" fill="#64748B" text-anchor="middle">HTTP API v2</text>
    <text x="83" y="68" font-size="11" fill="#64748B" text-anchor="middle">Cognito JWT authorizer</text>
  </g>

  <!-- API Lambda -->
  <g transform="translate(560,150)">
    <rect width="150" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="4" height="86" rx="2" fill="#4F46E5"/>
    <text x="83" y="32" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">API Lambda</text>
    <text x="83" y="52" font-size="11" fill="#64748B" text-anchor="middle">Node 24 · 512 MB</text>
    <text x="83" y="68" font-size="11" fill="#64748B" text-anchor="middle">Hexagonal · ports &amp; adapters</text>
  </g>

  <!-- SQS -->
  <g transform="translate(740,150)">
    <rect width="100" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="4" height="86" rx="2" fill="#4F46E5"/>
    <text x="56" y="32" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">SQS</text>
    <text x="56" y="52" font-size="11" fill="#64748B" text-anchor="middle">Queue</text>
    <text x="56" y="68" font-size="11" fill="#64748B" text-anchor="middle">DLQ · 3 retries</text>
  </g>

  <!-- ========== ROW B — auth badge (under API GW) ========== -->
  <g transform="translate(380,270)">
    <rect width="150" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="4" height="60" rx="2" fill="#4F46E5"/>
    <text x="83" y="26" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Cognito User Pool</text>
    <text x="83" y="44" font-size="11" fill="#64748B" text-anchor="middle">JWT · owner / admin RBAC</text>
  </g>

  <!-- ========== ROW C — async worker + LLM (y=380) ========== -->
  <g transform="translate(380,380)">
    <rect width="190" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="4" height="86" rx="2" fill="#4F46E5"/>
    <text x="103" y="32" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Categorizer Lambda</text>
    <text x="103" y="52" font-size="11" fill="#64748B" text-anchor="middle">Node 24 · 512 MB</text>
    <text x="103" y="68" font-size="11" fill="#64748B" text-anchor="middle">4-layer cascade · async</text>
  </g>

  <g transform="translate(940,380)">
    <rect width="130" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="4" height="86" rx="2" fill="#D97706"/>
    <text x="71" y="32" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Gemini API</text>
    <text x="71" y="52" font-size="11" fill="#64748B" text-anchor="middle">Flash · generate</text>
    <text x="71" y="68" font-size="11" fill="#64748B" text-anchor="middle">Embedding 001 · 768-d</text>
  </g>

  <!-- ========== ROW D — shared data (y=510) ========== -->
  <g transform="translate(380,510)">
    <rect width="560" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect width="4" height="60" rx="2" fill="#0F766E"/>
    <text x="288" y="26" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Neon Postgres + pgvector</text>
    <text x="288" y="44" font-size="11" fill="#64748B" text-anchor="middle">Auto-suspend · write-through cascade · 768-dim embeddings</text>
  </g>

  <!-- ========== ARROWS ========== -->
  <!-- Row A horizontal -->
  <line x1="170" y1="193" x2="195" y2="193" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="193" x2="375" y2="193" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="193" x2="555" y2="193" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="710" y1="193" x2="735" y2="193" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="722" y="186" font-size="10" fill="#64748B" text-anchor="middle">publish</text>

  <!-- API GW → Cognito (vertical, short) -->
  <line x1="455" y1="236" x2="455" y2="265" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-auth)"/>
  <text x="463" y="255" font-size="10" fill="#4F46E5" font-weight="600">verify JWT</text>

  <!-- SQS → Categorizer (curve from SQS bottom, down-left to Categorizer top) -->
  <path d="M 790 236 Q 790 310 575 310 Q 575 310 575 375" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="304" font-size="10" fill="#64748B">async · batch · 180s visibility</text>

  <!-- Categorizer → Gemini (horizontal, dashed amber) -->
  <line x1="570" y1="423" x2="935" y2="423" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-ai)"/>
  <text x="752" y="416" font-size="10" fill="#D97706" font-weight="600" text-anchor="middle">embed + LLM (only on ambiguity)</text>

  <!-- API Lambda → Neon (vertical down from API Lambda center x=635, clean of Categorizer which ends at x=570) -->
  <line x1="635" y1="236" x2="635" y2="505" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrow-data)"/>
  <text x="645" y="370" font-size="10" fill="#0F766E" font-weight="600">INSERT</text>

  <!-- Categorizer → Neon (vertical down from Categorizer center x=475) -->
  <line x1="475" y1="466" x2="475" y2="505" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrow-data)"/>
  <text x="485" y="492" font-size="10" fill="#0F766E" font-weight="600">UPDATE</text>

  <!-- ========== LEGEND ========== -->
  <g transform="translate(50,582)" font-size="10" fill="#475569">
    <g>
      <rect width="14" height="3" y="6" fill="#334155"/>
      <text x="22" y="11">request</text>
    </g>
    <g transform="translate(95,0)">
      <rect width="14" height="3" y="6" fill="#0F766E"/>
      <text x="22" y="11">data write</text>
    </g>
    <g transform="translate(200,0)">
      <rect width="14" height="3" y="6" fill="#4F46E5" stroke-dasharray="3 2"/>
      <text x="22" y="11">auth</text>
    </g>
    <g transform="translate(270,0)">
      <rect width="14" height="3" y="6" fill="#D97706" stroke-dasharray="3 2"/>
      <text x="22" y="11">LLM</text>
    </g>
    <g transform="translate(325,0)">
      <rect width="14" height="3" y="6" fill="#F48120"/>
      <text x="22" y="11">Cloudflare</text>
    </g>
  </g>
  <text x="1050" y="593" font-size="10" fill="#94A3B8" text-anchor="end">POST → 201 in ~100 ms · categorization runs async · ~80% never hit the LLM</text>
</svg>