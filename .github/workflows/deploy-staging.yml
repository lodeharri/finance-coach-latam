name: deploy-staging

# Auto-deploy to the staging environment on every merge to main.
# Production deploys go through deploy-production.yml (manual approval).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - 'frontend/**'
      - '.github/workflows/deploy-*.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  deploy:
    name: Deploy backend to staging
    environment: staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (access keys)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build backend bundles
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: CDK deploy
        id: cdk
        working-directory: infra
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.COGNITO_USER_POOL_CLIENT_ID }}
          LLM_PROVIDER: gemini
        run: |
          npm ci
          npx cdk deploy FinanceCoachStack \
            --require-approval never \
            --outputs-file /tmp/cdk-outputs.json

      - name: Export CDK outputs to step outputs
        id: outputs
        run: |
          API_URL=$(jq -r '.FinanceCoachStack.FinanceCoachApiUrl' /tmp/cdk-outputs.json)
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test (health + endpoint presence)
        env:
          API_URL: ${{ steps.outputs.outputs.api_url }}
        run: |
          echo "Health check..."
          HTTP=$(curl -s -o /tmp/health.json -w "%{http_code}" "$API_URL/health")
          if [ "$HTTP" != "200" ]; then
            echo "✗ /health returned $HTTP"
            cat /tmp/health.json
            exit 1
          fi
          echo "✓ /health OK"

          echo "Categories endpoint reachable (without auth should be 401):"
          HTTP=$(curl -s -o /tmp/cats.json -w "%{http_code}" "$API_URL/categories")
          if [ "$HTTP" != "401" ]; then
            echo "✗ /categories returned $HTTP (expected 401 from API Gateway authorizer)"
            cat /tmp/cats.json
            exit 1
          fi
          echo "✓ /categories requires auth"

      - name: Summary
        run: |
          echo "## Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- API URL: \`${{ steps.cdk.outputs.FinanceCoachApiUrl }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  deploy-frontend:
    name: Deploy frontend to Cloudflare Pages
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build SPA
        env:
          VITE_API_BASE_URL: ${{ needs.deploy.outputs.api_url }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.COGNITO_USER_POOL_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ secrets.AWS_REGION }}
        run: |
          npm ci
          npm run build
          # Fail fast if env vars are empty — silent bugs surface as broken SPA at runtime.
          test -n "$VITE_API_BASE_URL" || (echo "VITE_API_BASE_URL is empty" && exit 1)
          test -n "$VITE_COGNITO_USER_POOL_CLIENT_ID" || (echo "VITE_COGNITO_USER_POOL_CLIENT_ID is empty" && exit 1)

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=finance-coach-latam --branch=main

      - name: Smoke (Pages URL reachable)
        run: |
          URL="https://finance-coach-latam.pages.dev"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          [ "$HTTP" = "200" ] || (echo "Pages returned $HTTP" && exit 1)
          echo "✓ Pages URL returned 200"
