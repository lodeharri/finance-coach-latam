name: deploy-production

# Manual production deploy. The `production` environment in GitHub has
# required reviewers configured, so a human must approve before this can
# run. Use the "Run workflow" button in the Actions UI.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy to production' to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel an in-flight production deploy

jobs:
  guard:
    name: Confirm deploy intent
    runs-on: ubuntu-latest
    outputs:
      confirmed: ${{ steps.check.outputs.confirmed }}
    steps:
      - id: check
        run: |
          if [ "${{ inputs.confirm }}" = "deploy to production" ]; then
            echo "confirmed=true" >> "$GITHUB_OUTPUT"
          else
            echo "✗ Refusing to deploy. Expected input 'deploy to production', got: '${{ inputs.confirm }}'"
            exit 1
          fi

  deploy:
    name: Deploy backend to production
    needs: guard
    if: needs.guard.outputs.confirmed == 'true'
    environment: production   # required reviewers gate applies here
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (access keys)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Provision demo password (SSM)
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEMO_PASSWORD" || { echo "::error::DEMO_PASSWORD secret unset"; exit 1; }
          aws ssm put-parameter --name "/finance-coach-latam/demo-password" \
            --value "$DEMO_PASSWORD" --type SecureString --tier Standard \
            --overwrite --region us-east-1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build backend bundles
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: CDK deploy
        id: cdk
        working-directory: infra
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.COGNITO_USER_POOL_CLIENT_ID }}
          LLM_PROVIDER: gemini
        run: |
          npm ci
          npx cdk deploy FinanceCoachStack \
            --require-approval never \
            --outputs-file /tmp/cdk-outputs.json

      - name: Export CDK outputs to step outputs
        id: outputs
        run: |
          API_URL=$(jq -r '.FinanceCoachStack.FinanceCoachApiUrl' /tmp/cdk-outputs.json)
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"

      - name: Production smoke test
        env:
          API_URL: ${{ steps.outputs.outputs.api_url }}
        run: |
          set -e

          echo "Health check..."
          curl -fsS "$API_URL/health" > /dev/null && echo "✓ /health OK"

          echo "Auth gate (no token → 401)..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/categories")
          [ "$HTTP" = "401" ] && echo "✓ /categories requires auth"

      - name: Summary
        run: |
          echo "## Production deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- API URL: \`${{ steps.cdk.outputs.FinanceCoachApiUrl }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Verify in CloudWatch that the worker is processing transactions." >> $GITHUB_STEP_SUMMARY

  deploy-frontend:
    name: Deploy frontend to Cloudflare Pages
    needs: [guard, deploy]
    if: needs.guard.outputs.confirmed == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build SPA
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.COGNITO_USER_POOL_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ secrets.AWS_REGION }}
        run: |
          npm ci
          npm run build
          test -n "$VITE_API_BASE_URL" || (echo "VITE_API_BASE_URL is empty" && exit 1)
          test -n "$VITE_COGNITO_USER_POOL_CLIENT_ID" || (echo "VITE_COGNITO_USER_POOL_CLIENT_ID is empty" && exit 1)

      - name: Smoke (Pages URL reachable)
        run: |
          URL="https://finance-coach-latam.pages.dev"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          [ "$HTTP" = "200" ] || (echo "Pages returned $HTTP" && exit 1)
          echo "✓ Pages URL returned 200"
